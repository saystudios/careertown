name: Test CareerTown character redesign

on:
  pull_request:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Build game
        run: npm run build
      - name: Run existing tests
        run: npm test
